name: Release

# Pushing a `v*` tag builds `atlassian` for Linux and macOS (amd64 and arm64)
# and publishes them on the tag's GitHub Release, creating the release if it
# doesn't exist yet (e.g. when the tag was pushed from git) or adding to it if
# it does (e.g. when the release was drafted and published on github.com).
#
# Pull requests that touch the build setup build the same binaries without
# publishing. A manual run does the same, or, given a `tag`, builds that tag
# and publishes to its release, which re-publishes binaries for a release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (e.g. v0.1.0) to build and publish. Leave empty to only build.
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # The tag being released, or empty when only building.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml version
        if: env.RELEASE_TAG
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${RELEASE_TAG}" != "v${crate_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match Cargo.toml version ${crate_version} (expected v${crate_version})"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            # Older glibc than ubuntu-latest, so the binary runs on more distros.
            runner: ubuntu-22.04
            native: true
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            native: true
          - name: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            native: true
          - name: macos-amd64
            # Cross-compiled on the Apple Silicon runner; Apple's toolchain
            # builds for both architectures.
            target: x86_64-apple-darwin
            runner: macos-latest
            native: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.native
        run: ./target/${{ matrix.target }}/release/atlassian --version
      - name: Package
        shell: bash
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            version="${RELEASE_TAG}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          dir="atlassian-${version}-${{ matrix.name }}"
          mkdir -p "dist/${dir}"
          cp "target/${{ matrix.target }}/release/atlassian" README.md LICENSE "dist/${dir}/"
          cd dist
          tar czf "${dir}.tar.gz" "${dir}"
          shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          rm -r "${dir}"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: atlassian-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    # Job-level `if` can't read `env`, so repeat the RELEASE_TAG condition.
    if: github.ref_type == 'tag' || inputs.tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: atlassian-*
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Created on github.com (or by an earlier run): attach the files,
            # replacing any with the same name so re-runs are safe.
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes
          fi
