[package]
name = "atlassian-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only command line client for Atlassian Data Center products"
license-file = "LICENSE"
repository = "https://github.com/luke-falvey/atlassian-cli"

[[bin]]
name = "atlassian"
path = "src/main.rs"

[lib]
name = "atlassian_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["json", "query"] }
serde_json = "1.0"
thiserror = "2.0"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.2"
base64 = "0.22"
predicates = "3.1"
regex = "1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
